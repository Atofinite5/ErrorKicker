services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kicker
      POSTGRES_PASSWORD: kicker
      POSTGRES_DB: errorkicker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gate:
    build:
      context: .
      dockerfile: apps/gate/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://kicker:kicker@postgres:5432/errorkicker
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      NEXT_PUBLIC_GATE_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - gate

volumes:
  pgdata:
  redisdata:
